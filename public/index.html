<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RideBook - Modern ride booking application">
  <meta name="theme-color" content="#000000">
  
  <title>RideBook — Request a Ride</title>
  
  <!-- Leaflet Map Library -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">

  <!-- Display typeface used for the fare, ride-type names, and header wordmark -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Smooth page transitions */
    body {
      animation: fadeIn 300ms ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Loading indicator */
    .loading-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-background);
      padding: 2rem;
      border-radius: var(--radius-xl);
      border: 1px solid var(--color-border);
      display: none;
      z-index: 1000;
      backdrop-filter: blur(10px);
      box-shadow: var(--shadow-xl);
    }

    .loading-indicator.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--spacing-lg);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* User info badge */
    .user-badge {
      position: absolute;
      top: var(--spacing-md);
      right: var(--spacing-md);
      display: flex;
      align-items: center;
      gap: var(--spacing-md);
      background: var(--color-background);
      padding: var(--spacing-sm) var(--spacing-md);
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      font-size: 0.85rem;
      /* Leaflet's own panes/controls use z-index up to 1000 (tiles 200,
         markers 600, popups 700, zoom control 1000), and they get
         repainted on every zoom/pan. Anything below 1000 here can end up
         stacked underneath them after a redraw. */
      z-index: 1001;
      box-shadow: var(--shadow-sm);
    }

    .user-badge span {
      font-weight: 600;
      color: var(--color-accent-primary);
    }

    .logout-btn {
      background: none;
      border: 1px solid var(--color-border);
      padding: 0.375rem 0.75rem;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-size: 0.8rem;
      font-weight: 600;
      transition: var(--transition-fast);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--color-text-secondary);
    }

    .logout-btn:hover {
      background: var(--color-primary);
      color: var(--color-text-inverse);
      border-color: var(--color-primary);
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- SIDEBAR: Controls and Ride Info -->
    <aside id="sidebar" role="complementary" aria-label="Ride controls and history">
      <header>
        <h1>RideBook</h1>
      </header>

      <div class="instruction" role="status" aria-live="polite" id="instruction">
        Click the map to set your pickup location
      </div>
 
      <button id="use-location-btn" class="use-location-btn" type="button" aria-label="Use my current GPS location as pickup">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
        </svg>
        Use My Location
      </button>

      <div id="ride-controls" class="hidden" role="region" aria-label="Request controls">
        <div class="route-line">
          <div class="route-line-track" aria-hidden="true">
            <span class="route-stop-dot pickup"></span>
            <span class="route-thread"></span>
            <span class="route-stop-dot dropoff"></span>
          </div>
          <div class="route-line-stops">
            <div class="route-stop">
              <span class="route-stop-label">Pickup</span>
              <span class="route-stop-value" id="pickup-address">—</span>
            </div>
            <div class="route-stop">
              <span class="route-stop-label">Dropoff</span>
              <span class="route-stop-value" id="dropoff-address">—</span>
            </div>
          </div>
        </div>

        <div id="ride-type-selector" class="ride-type-selector" role="radiogroup" aria-label="Choose ride size">
          <label class="ride-type-option">
            <input type="radio" name="ride-type" value="ride" checked>
            <span class="ride-type-seats-icon" aria-hidden="true"><span></span><span></span></span>
            <span class="ride-type-name">Ride</span>
            <span class="ride-type-seats">2 seats</span>
          </label>
          <label class="ride-type-option">
            <input type="radio" name="ride-type" value="rideL">
            <span class="ride-type-seats-icon" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
            <span class="ride-type-name">RideL</span>
            <span class="ride-type-seats">4 seats</span>
          </label>
          <label class="ride-type-option">
            <input type="radio" name="ride-type" value="rideXL">
            <span class="ride-type-seats-icon" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></span>
            <span class="ride-type-name">RideXL</span>
            <span class="ride-type-seats">6 seats</span>
          </label>
        </div>

        <div class="ride-fare-estimate" id="ride-fare-estimate" role="status" aria-live="polite">
          <div class="ride-fare-row">
            <span class="ride-fare-label">Trip</span>
            <span class="ride-fare-trip" id="ride-trip-distance">Calculating route…</span>
          </div>
          <div class="ride-fare-divider" aria-hidden="true"></div>
          <div class="ride-fare-row ride-fare-row-total">
            <span class="ride-fare-label">Fare</span>
            <span class="ride-fare-value" id="ride-fare-value">—</span>
          </div>
        </div>

        <div class="ride-controls-actions">
          <button id="request-btn" aria-label="Request a ride with selected locations">
            Confirm ride
          </button>
          <button id="reset-btn" aria-label="Clear selected locations">
            Reset
          </button>
        </div>
      </div>

      <section role="region" aria-labelledby="current-ride-heading">
        <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2 id="current-ride-heading">Current Request</h2>
          <a href="/history.html" style="font-size: 0.8rem; color: var(--color-accent-primary); text-decoration: none;">View History →</a>
        </div>
        <div id="current-ride">
          <p style="color: var(--color-text-tertiary); font-style: italic;">
            No active ride. Set a pickup and dropoff on the map to request one.
          </p>
        </div>
      </section>
    </aside>

    <!-- MAP: Interactive Leaflet Map -->
    <main id="map" role="main" aria-label="Interactive map for setting ride locations">
      <div class="user-badge" id="user-badge" style="display: none;">
        <span id="user-name">User</span>
        <button class="logout-btn" id="logout-btn" aria-label="Logout">Logout</button>
      </div>
    </main>
  </div>

  <!-- Loading Indicator -->
  <div id="loading-indicator" class="loading-indicator" role="status" aria-label="Loading">
    <div class="loading-spinner"></div>
    <p style="margin-top: 1rem; text-align: center;">Requesting ride...</p>
  </div>

  <!-- Leaflet Script -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <!-- Session & Auth Scripts -->
  <script src="auth.js"></script>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
