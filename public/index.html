<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RideBook - Modern ride booking application">
  <meta name="theme-color" content="#0f172a">
  
  <title>RideBook — Request a Ride</title>
  
  <!-- Leaflet Map Library -->
  <link 
    rel="stylesheet" 
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin="">
  
  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Smooth page transitions */
    body {
      animation: fadeIn 300ms ease-in-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    /* Loading indicator */
    .loading-indicator {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: var(--color-primary-light);
      padding: 2rem;
      border-radius: var(--radius-lg);
      border: 1px solid var(--color-border);
      display: none;
      z-index: 1000;
      backdrop-filter: blur(10px);
    }

    .loading-indicator.active {
      display: block;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--color-border);
      border-top-color: var(--color-accent-orange);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>
  <div id="app">
    <!-- SIDEBAR: Controls and Ride Info -->
    <aside id="sidebar" role="complementary" aria-label="Ride controls and history">
      <header>
        <h1>RideBook</h1>
      </header>

      <div class="instruction" role="status" aria-live="polite" id="instruction">
        Click the map to set your pickup location
      </div>

      <div id="ride-controls" class="hidden" role="region" aria-label="Request controls">
        <button id="request-btn" aria-label="Request a ride with selected locations">
          Request Ride
        </button>
        <button id="reset-btn" aria-label="Clear selected locations">
          Reset
        </button>
      </div>

      <section role="region" aria-labelledby="rides-heading">
        <h2 id="rides-heading">Requested Rides</h2>
        <ul id="rides-list" role="list" aria-label="History of requested rides">
          <li style="color: var(--color-text-tertiary); font-style: italic; list-style: none;">
            No rides requested yet
          </li>
        </ul>
      </section>
    </aside>

    <!-- MAP: Interactive Leaflet Map -->
    <main id="map" role="main" aria-label="Interactive map for setting ride locations"></main>
  </div>

  <!-- Loading Indicator -->
  <div id="loading-indicator" class="loading-indicator" role="status" aria-label="Loading">
    <div class="loading-spinner"></div>
    <p style="margin-top: 1rem; text-align: center;">Requesting ride...</p>
  </div>

  <!-- Leaflet Script -->
  <script 
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>

  <!-- Application Script -->
  <script src="app.js"></script>
</body>
</html>
