<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RideBook - Reset your password">
  <meta name="theme-color" content="#000000">

  <title>RideBook — Forgot Password</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="login-container">
    <!-- Forgot Password Form Panel -->
    <div class="login-panel">
      <div class="login-form-container">
        <div class="login-logo">RideBook</div>
        <p class="login-tagline">
          Enter your username and we'll generate a link to reset your password.
        </p>

        <div class="login-error" id="forgot-error"></div>
        <div class="login-success" id="forgot-success"></div>

        <form class="login-form" id="forgot-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input
              type="text"
              id="username"
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
          </div>

          <div class="login-button-group">
            <button type="submit" class="login-button" id="forgot-btn">
              Send Reset Link
            </button>
          </div>

          <div class="login-links">
            <a href="/login.html">Back to login</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Visual Panel (shows on desktop) -->
    <div class="login-visual">
      <div class="login-visual-content">
        <h2>Forgot your password?</h2>
        <p>
          No problem. We'll help you get back into your account in just a couple steps.
        </p>
      </div>
    </div>
  </div>

  <script src="forgot-password.js"></script>
</body>
</html>
