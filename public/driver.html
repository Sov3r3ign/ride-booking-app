<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RideBook Driver Dashboard - Manage pending rides">
  <meta name="theme-color" content="#0f172a">
  
  <title>RideBook — Driver Dashboard</title>
  
  <link rel="stylesheet" href="style.css">
  
  <style>
    body {
      overflow: auto;
    }

    #driver-dashboard {
      overflow: auto;
      max-height: 100vh;
    }

    /* Status indicator animation */
    .ride-status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }

    .status-pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      animation: pulse-animation 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .status-pulse.pending {
      background: var(--color-accent-orange);
    }

    .status-pulse.accepted {
      background: var(--color-accent-teal);
    }

    @keyframes pulse-animation {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* Ride card grid on larger screens */
    @media (min-width: 1024px) {
      #driver-rides {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: var(--spacing-lg);
      }

      .ride-card {
        margin-bottom: 0;
      }
    }

    /* Header styling */
    .driver-header {
      margin-bottom: var(--spacing-2xl);
      padding-bottom: var(--spacing-xl);
      border-bottom: 1px solid var(--color-border);
    }

    .driver-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: var(--spacing-lg);
      margin-top: var(--spacing-lg);
      padding-top: var(--spacing-lg);
      border-top: 1px solid var(--color-border);
    }

    .stat-box {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--spacing-md);
      text-align: center;
    }

    .stat-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--color-accent-purple);
      margin-bottom: var(--spacing-xs);
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--color-text-tertiary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Time indicator */
    .ride-time {
      display: block;
      font-size: 0.75rem;
      color: var(--color-text-tertiary);
      margin-top: var(--spacing-sm);
      font-family: var(--font-mono);
    }

    /* Empty state styling */
    .empty-state {
      text-align: center;
      padding: var(--spacing-2xl);
    }

    .empty-state-icon {
      font-size: 3rem;
      margin-bottom: var(--spacing-lg);
      opacity: 0.5;
    }

    /* Auto-refresh indicator */
    .auto-refresh-status {
      position: fixed;
      bottom: var(--spacing-lg);
      right: var(--spacing-lg);
      display: flex;
      align-items: center;
      gap: var(--spacing-sm);
      padding: var(--spacing-sm) var(--spacing-md);
      background: var(--color-primary-light);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      color: var(--color-text-tertiary);
      backdrop-filter: blur(10px);
    }

    .refresh-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--color-accent-teal);
      animation: pulse-animation 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
  </style>
</head>

<body>
  <div id="driver-dashboard" role="main" aria-label="Driver dashboard for managing rides">
    <header class="driver-header">
      <h1>Driver Dashboard</h1>
      <p>Manage pending and accepted rides</p>
      
      <div class="driver-stats">
        <div class="stat-box">
          <div class="stat-value" id="stat-pending">0</div>
          <div class="stat-label">Pending</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-accepted">0</div>
          <div class="stat-label">Accepted</div>
        </div>
        <div class="stat-box">
          <div class="stat-value" id="stat-completed">0</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>
    </header>

    <section role="region" aria-labelledby="rides-heading" aria-live="polite" aria-label="Active rides">
      <div id="driver-rides" role="list" aria-label="List of active rides">
        <div class="empty-state">
          <p style="color: var(--color-text-tertiary); font-style: italic;">
            Checking for available rides...
          </p>
        </div>
      </div>
    </section>

    <!-- Auto-refresh indicator -->
    <div class="auto-refresh-status">
      <div class="refresh-dot"></div>
      <span>Live updates</span>
    </div>
  </div>

  <script src="driver.js"></script>
</body>
</html>
