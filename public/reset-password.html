<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RideBook - Set a new password">
  <meta name="theme-color" content="#000000">

  <title>RideBook — Reset Password</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="login-container">
    <!-- Reset Password Form Panel -->
    <div class="login-panel">
      <div class="login-form-container">
        <div class="login-logo">RideBook</div>
        <p class="login-tagline">
          Choose a new password for your account.
        </p>

        <div class="login-error" id="reset-error"></div>
        <div class="login-success" id="reset-success"></div>

        <form class="login-form" id="reset-form">
          <div class="form-group">
            <label for="new-password">New Password</label>
            <input
              type="password"
              id="new-password"
              placeholder="Enter a new password"
              autocomplete="new-password"
              required
            >
            <span class="form-hint">At least 6 characters</span>
          </div>

          <div class="form-group">
            <label for="confirm-password">Confirm New Password</label>
            <input
              type="password"
              id="confirm-password"
              placeholder="Re-enter your new password"
              autocomplete="new-password"
              required
            >
          </div>

          <div class="login-button-group">
            <button type="submit" class="login-button" id="reset-btn">
              Reset Password
            </button>
          </div>

          <div class="login-links">
            <a href="/login.html">Back to login</a>
          </div>
        </form>
      </div>
    </div>

    <!-- Visual Panel (shows on desktop) -->
    <div class="login-visual">
      <div class="login-visual-content">
        <h2>Almost there</h2>
        <p>
          Set a new password and you'll be back in your account in seconds.
        </p>
      </div>
    </div>
  </div>

  <script src="reset-password.js"></script>
</body>
</html>
