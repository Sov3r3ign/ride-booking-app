<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RideBook - Professional ride booking login">
  <meta name="theme-color" content="#000000">
  
  <title>RideBook — Login</title>
  
  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
</head>

<body>
  <div class="login-container">
    <!-- Login Form Panel -->
    <div class="login-panel">
      <div class="login-form-container">
        <div class="login-logo">RideBook</div>
        <p class="login-tagline">
          Request a ride instantly. Drive and earn. Professional grade mobility for modern cities.
        </p>

        <div class="login-error" id="login-error" role="alert" aria-live="assertive"></div>

        <form class="login-form" id="login-form">
          <div class="form-group">
            <label for="username">Username</label>
            <input 
              type="text" 
              id="username" 
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input 
              type="password" 
              id="password" 
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
          </div>

          <div class="login-button-group">
            <button type="submit" class="login-button" id="login-btn">
              Login
            </button>
          </div>

          <div class="login-links">
            <a href="/forgot-password.html">Forgot password?</a>
          </div>
        </form>

        <div class="login-signup-cta">
          Don't have an account? <a href="/signup.html">Sign up</a>
        </div>
      </div>
    </div>

    <!-- Visual Panel (shows on desktop) -->
    <div class="login-visual">
      <div class="login-visual-content">
        <h2>Go. Move. Earn.</h2>
        <p>
          Join thousands of drivers and riders who trust RideBook for seamless urban mobility.
        </p>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
